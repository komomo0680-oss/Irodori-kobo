<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スタンプ管理</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1d1f1d;--sub:#6b716b;--ac:#06c755;--bd:#e2e5e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161816;--card:#222522;--tx:#eef0ee;--sub:#9aa19a;--bd:#343834}}
:root[data-theme="dark"]{--bg:#161816;--card:#222522;--tx:#eef0ee;--sub:#9aa19a;--bd:#343834}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.card .ic{width:100%;aspect-ratio:1;border-radius:10px;background:var(--bg);object-fit:contain;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.card b{display:block;font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--sub);font-size:11px}
.add{border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ac);font-size:28px;min-height:130px}
.add small{color:var(--ac);font-size:12px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
input.nm{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:600;background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--bd);padding:4px}
.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
.cell{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:10px;aspect-ratio:37/32;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:contain}
.cell i{position:absolute;left:4px;top:4px;font-style:normal;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 5px}
.cell button{position:absolute;right:3px;top:3px;padding:0 6px;font-size:14px;line-height:20px;border-radius:50%}
.muted{color:var(--sub);font-size:13px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="fMain" accept="image/*" class="hidden">
<input type="file" id="fStamps" accept="image/*" multiple class="hidden">
<script>
let S={sets:[]},cur=null,db=null;
const $=s=>document.querySelector(s);
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('stampmgr',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function load(){return new Promise(r=>{if(!db)return r();try{const g=db.transaction('kv').objectStore('kv').get('s');g.onsuccess=()=>{if(g.result)S=g.result;r()};g.onerror=()=>r()}catch(e){r()}})}
function save(){try{if(db)db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}}
function shrink(file,max){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/png'))};im.src=u})}
function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function home(){cur=null;
$('#app').innerHTML='<h1>スタンプ管理</h1><div class="grid">'+S.sets.map(s=>'<div class="card" onclick="openSet(\''+s.id+'\')">'+(s.main?'<img class="ic" src="'+s.main+'">':'<div class="ic">画像なし</div>')+'<b>'+esc(s.name)+'</b><small>'+s.stamps.length+'個</small></div>').join('')+'<div class="card add" onclick="newSet()">＋<small>新しいセット</small></div></div>'+(S.sets.length?'<p class="muted">アイコンをタップすると中身を一覧で見られます</p>':'<p class="muted">まずセットを作って、トップ画像を選びましょう</p>')}
function newSet(){const s={id:'s'+Date.now(),name:'新しいスタンプ',main:'',stamps:[]};S.sets.push(s);save();openSet(s.id)}
function openSet(id){cur=S.sets.find(s=>s.id===id);detail()}
function detail(){const s=cur;
$('#app').innerHTML='<div class="top"><button onclick="home()">‹ 戻る</button><input class="nm" value="'+esc(s.name)+'" onchange="cur.name=this.value;save()"></div>'
+'<div class="row">'+(s.main?'<img src="'+s.main+'" style="width:72px;height:72px;object-fit:contain;border-radius:10px;border:1px solid var(--bd)">':'')
+'<button onclick="$(\'#fMain\').click()">トップ画像を'+(s.main?'変更':'選ぶ')+'</button><button class="pri" onclick="$(\'#fStamps\').click()">＋ スタンプを追加</button></div>'
+'<p class="muted">'+s.stamps.length+'個</p><div class="grid">'+s.stamps.map((d,i)=>'<div class="cell"><img src="'+d+'"><i>'+(i+1)+'</i><button onclick="del('+i+')">×</button></div>').join('')+'</div>'
+'<div class="row"><button onclick="delSet()" style="color:#d33">このセットを削除</button></div>'}
function del(i){if(confirm('このスタンプを削除しますか？')){cur.stamps.splice(i,1);save();detail()}}
function delSet(){if(confirm('セットごと削除しますか？')){S.sets=S.sets.filter(s=>s!==cur);save();home()}}
$('#fMain').onchange=async e=>{const f=e.target.files[0];if(!f)return;cur.main=await shrink(f,240);e.target.value='';save();detail()};
$('#fStamps').onchange=async e=>{for(const f of e.target.files)cur.stamps.push(await shrink(f,370));e.target.value='';save();detail()};
openDB().then(load).then(home);
</script>
</body>
</html>
